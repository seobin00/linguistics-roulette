
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linguistics Roulette</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #171923;
    color: #f7f4ed;
    font-family: Georgia, serif;
  }

  main {
    width: 100%;
    max-width: 540px;
    text-align: center;
  }

  .tag {
    color: #a6d8bd;
    font: 12px monospace;
    letter-spacing: 3px;
  }

  h1 {
    font-size: clamp(35px, 9vw, 58px);
    margin: 18px 0 8px;
  }

  .subtitle {
    color: #aaaebd;
    font: 14px monospace;
    line-height: 1.7;
  }

  .paper {
    background: #252a3a;
    border: 1px solid #454c60;
    border-radius: 16px;
    padding: 26px;
    margin: 30px 0 20px;
    text-align: left;
    min-height: 210px;
  }

  .category {
    color: #a6d8bd;
    font: 11px monospace;
    letter-spacing: 2px;
  }

  h2 {
    font-size: 23px;
    line-height: 1.4;
  }

  .authors, .year {
    color: #b0b6c5;
    font: 13px monospace;
    line-height: 1.6;
  }

  button {
    width: 100%;
    padding: 17px;
    border: 0;
    border-radius: 12px;
    background: #a6d8bd;
    color: #171923;
    font: bold 15px monospace;
    cursor: pointer;
  }

  button:disabled { opacity: .6; }

  a { color: #a6d8bd; }

  .hint {
    color: #858b9d;
    font: 11px monospace;
    margin-top: 22px;
  }
</style>
</head>

<body>
<main>
  <div class="tag">ACADEMIC CHAOS DEPARTMENT</div>

  <h1>📚 LINGUISTICS<br>ROULETTE</h1>

  <p class="subtitle">
    You don't choose the paper.<br>
    The paper chooses you.
  </p>

  <section class="paper">
    <div class="category">YOUR RANDOM PAPER</div>
    <h2 id="title">Ready to expand your linguistic knowledge?</h2>
    <p class="authors" id="authors">
      Unknown researchers are waiting...
    </p>
    <p class="year" id="year"></p>
    <p id="link"></p>
  </section>

  <button id="spin" onclick="getPaper()">
    GIVE ME A PAPER
  </button>

  <p class="hint">
    WARNING: MAY CAUSE UNEXPECTED DISCUSSIONS.
  </p>
</main>

<script>
async function getPaper() {
  const button = document.getElementById("spin");
  button.disabled = true;
  button.textContent = "SEARCHING THE ACADEMIC VOID...";

  document.getElementById("title").textContent =
    "Finding your next obsession...";

  try {
    const topics = [
      "phonetics",
      "phonology",
      "syntax",
      "semantics",
      "pragmatics",
      "sociolinguistics",
      "psycholinguistics",
      "morphology",
      "historical linguistics",
      "manosphere",
      "language acquisition",
      "conspiracy theory",
      "Conspiracist discourse",
      "computer mediated communication", 
      "Fake news",
      "Post-truth discourse",
      "Red pill discourse", 
      "Gender and digital media",
      "Male grievance narratives", 
      "Digital discourse", 
      "Internet memes", 
      "Online radicalization",
      "Political discourse",
      "Linguistic manipulation", 
      "Persuasive language",
      "Social identity theory", 
      "Gaslighting discourse",
      "Edgelord culture", 
      "Weaponized irony", 
      "Algorithmic radicalization",
      "Alt-right online discourse"
    ];

    const topic = topics[
      Math.floor(Math.random() * topics.length)
    ];

    const params = new URLSearchParams({
      search: topic,
      filter: "type:article,has_abstract:true",
      sample: "100",
      per_page: "100"
    });

    const response = await fetch(
      "https://api.openalex.org/works?" + params
    );

    if (!response.ok) throw new Error("API unavailable");

    const data = await response.json();

    const papers = data.results.filter(p =>
      p.title && p.authorships?.length
    );

    if (!papers.length) throw new Error("No papers found");

    const paper =
      papers[Math.floor(Math.random() * papers.length)];

    const authors = paper.authorships
      .slice(0, 4)
      .map(a => a.author.display_name)
      .join(", ");

    const url =
      paper.doi ||
      paper.best_oa_location?.landing_page_url ||
      paper.primary_location?.landing_page_url ||
      paper.id;

    document.getElementById("title").textContent =
      paper.title;

    document.getElementById("authors").textContent =
      authors + (paper.authorships.length > 4 ? " et al." : "");

    document.getElementById("year").textContent =
      paper.publication_year || "";

    document.getElementById("link").innerHTML = "";

    const link = document.createElement("a");
    link.href = url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = "READ THE PAPER →";

    document.getElementById("link").appendChild(link);

  } catch (error) {
    document.getElementById("title").textContent =
      "The academic void is temporarily unavailable.";

    document.getElementById("authors").textContent =
      "Try again in a moment!";
  }

  button.disabled = false;
  button.textContent = "GIVE ME ANOTHER PAPER";
}
</script>
</body>
</html>
